[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-script-lab2"
version = "0.1.0"
description = "LAB 02 - Understanding Bitcoin's Scripting Language (P2PKH & 2-of-2 P2SH Multisig)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-bitcoinlib>=0.12.2",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
